version: 2

project_name: axiom-syslog-proxy

builds:
  - <<: &build_defaults
      binary: axiom-syslog-proxy
      main: ./cmd/axiom-syslog-proxy
      env:
        - CGO_ENABLED=0
      tags:
        - osusergo
        - netgo
        - static_build
      flags:
        - -buildvcs=false
        - -buildmode=pie
        - -installsuffix=cgo
        - -trimpath
      ldflags:
        - -s -w -extldflags "-fno-PIC -static -Wl -z now -z relro"
        - -X github.com/axiomhq/pkg/version.release={{ .Version }}
        - -X github.com/axiomhq/pkg/version.revision={{ .ShortCommit }}
        - -X github.com/axiomhq/pkg/version.buildDate={{ .CommitDate }}
        - -X github.com/axiomhq/pkg/version.buildUser=goreleaser
      mod_timestamp: "{{ .CommitTimestamp }}"
    id: darwin
    goos:
      - darwin
    goarch:
      - amd64
      - arm64

  - <<: *build_defaults
    id: linux
    goos:
      - linux
    goarch:
      - amd64
      - arm64

  - <<: *build_defaults
    flags:
      - -buildvcs=false
      - -buildmode=exe
      - -installsuffix=cgo
      - -trimpath
    id: linux-no-pie
    goos:
      - linux
    goarch:
      - arm
      - 386
    goarm:
      - 6
      - 7

  - <<: *build_defaults
    flags:
      - -buildvcs=false
      - -buildmode=exe
      - -installsuffix=cgo
      - -trimpath
    id: docker
    goos:
      - linux
    goarch:
      - amd64

  - <<: *build_defaults
    id: windows
    goos:
      - windows
    goarch:
      - amd64
      - 386

archives:
  - <<: &archive_defaults
      name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
    id: nix
    ids:
      - darwin
      - linux
      - linux-no-pie
    wrap_in_directory: true
    formats:
      - tar.gz
    files:
      - LICENSE
      - README.md
  - <<: *archive_defaults
    id: windows
    ids:
      - windows
    wrap_in_directory: false
    formats:
      - zip
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  use: github-native

milestones:
  - repo:
      owner: axiomhq
      name: axiom-syslog-proxy
    close: true
    fail_on_error: false

release:
  github:
    owner: axiomhq
    name: axiom-syslog-proxy
  prerelease: auto
  name_template: "Axiom Syslog Proxy v{{ .Version }}"

homebrew_casks:
  - name: axiom-syslog-proxy
    description: Syslog ingestion by proxy for Axiom
    homepage: https://axiom.co
    license: MIT
    ids:
      - nix
    repository:
      owner: axiomhq
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TOKEN }}"
    commit_author:
      name: axiom-automation
      email: hello@axiom.co
    skip_upload: auto
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/{{ .ProjectName }}"]
          end

dockers_v2:
  - ids:
      - docker
    images:
      - docker.io/axiomhq/axiom-syslog-proxy
      - ghcr.io/axiomhq/axiom-syslog-proxy
    tags:
      - "{{ .Major }}"
      - "{{ .Major }}.{{ .Minor }}"
      - "{{ .Major }}.{{ .Minor }}.{{ .Patch }}"
      - latest
    platforms:
      - linux/amd64
    # Push a plain image, not an image index with attestations.
    sbom: false
    flags:
      - --provenance=false
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.description: "{{ .ProjectName }}"
      org.opencontainers.image.url: "https://axiom.co"
      org.opencontainers.image.source: "https://github.com/axiomhq/axiom-syslog-proxy"
      org.opencontainers.image.documentation: "https://github.com/axiomhq/axiom-syslog-proxy"
      org.opencontainers.image.licenses: "MIT"
      org.opencontainers.image.author: "Axiom, Inc. <info@axiom.co>"
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.vendor: "Axiom, Inc."
